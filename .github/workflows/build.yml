  build-variant-4:
    name: Вариант 4 (актуальная сборка PRO SCM)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Автотесты актуальной сборки «Вариант 4»
        run: |
          go vet ./cmd/... ./internal/...
          go test -v -race ./internal/...

      - name: Кросс-компиляция Windows x64 — «Вариант 4»
        run: |
          mkdir -p "dist/Вариант 4"

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
