      - name: Кросс-компиляция Windows x64 — «Вариант 3»
        run: |
          mkdir -p "dist/Вариант 3"

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o "dist/Вариант 3/OstatkiZakupki_Вариант_3.exe" ./variants/variant3/cmd/ostatki

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/Вариант 3/OstatkiZakupki_Вариант_3_cli.exe" ./variants/variant3/cmd/ostatki

          cat << 'BAT1' > "dist/Вариант 3/Запустить_Вариант_3.bat"
          @echo off
