name: Сборка Windows — Варианты 1, 2, 3 и 4

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'variant-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-variant-1:
    name: Вариант 1 (сохранённая базовая сборка)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Автотесты сборки «Вариант 1»
        run: |
          go vet ./variants/variant1/...
          go test -v -race ./variants/variant1/...

      - name: Кросс-компиляция Windows x64 — «Вариант 1»
        run: |
          mkdir -p "dist/Вариант 1"

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o "dist/Вариант 1/OstatkiZakupki_Вариант_1.exe" ./variants/variant1/cmd/ostatki

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/Вариант 1/OstatkiZakupki_Вариант_1_cli.exe" ./variants/variant1/cmd/ostatki

          cat << 'BAT1' > "dist/Вариант 1/Запустить_Вариант_1.bat"
          @echo off
          chcp 65001 >nul
          start "" "%~dp0OstatkiZakupki_Вариант_1.exe"
          BAT1

          cp "Ведомость с периодом ОК (Вариант 1).xlsx" "dist/Вариант 1/"
          cp README.md AGENTS.md CHANGELOG.md "dist/Вариант 1/"

          cp "dist/Вариант 1/OstatkiZakupki_Вариант_1.exe" "dist/OstatkiZakupki_Variant_1.exe"
          (cd "dist/Вариант 1" && zip -r ../Variant_1_Windows_x64.zip .)

      - name: Публикация артефакта «Вариант 1»
        uses: actions/upload-artifact@v4
        with:
          name: Вариант 1
          path: dist/Вариант 1/*
          if-no-files-found: error

      - name: Публикация релиза GitHub «Вариант 1»
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_V1="Сохранённая эталонная сборка «Вариант 1» (Windows x64 GUI + CLI + заполненная ведомость 8 525,23 руб.)."
          if gh release view variant-1 >/dev/null 2>&1; then
            for old in $(gh release view variant-1 --json assets --jq '.assets[].name'); do
              gh release delete-asset variant-1 "$old" -y || true
            done
            gh release edit variant-1 --latest=false --title "Вариант 1" --notes "$NOTES_V1"
            gh release upload variant-1 \
              "dist/OstatkiZakupki_Variant_1.exe#OstatkiZakupki_Variant_1.exe (Вариант 1 — Windows x64 GUI)" \
              "dist/Variant_1_Windows_x64.zip#Variant_1_Windows_x64.zip (Полный архив Вариант 1)" --clobber
          else
            gh release create variant-1 \
              --target "${{ github.sha }}" \
              --latest=false \
              --title "Вариант 1" \
              --notes "$NOTES_V1" \
              "dist/OstatkiZakupki_Variant_1.exe#OstatkiZakupki_Variant_1.exe (Вариант 1 — Windows x64 GUI)" \
              "dist/Variant_1_Windows_x64.zip#Variant_1_Windows_x64.zip (Полный архив Вариант 1)"
          fi

  build-variant-2:
    name: Вариант 2 (сохранённая сборка PRO SCM v2)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Автотесты сборки «Вариант 2»
        run: |
          go vet ./variants/variant2/...
          go test -v -race ./variants/variant2/...

      - name: Кросс-компиляция Windows x64 — «Вариант 2»
        run: |
          mkdir -p "dist/Вариант 2"

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o "dist/Вариант 2/OstatkiZakupki_Вариант_2.exe" ./variants/variant2/cmd/ostatki

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/Вариант 2/OstatkiZakupki_Вариант_2_cli.exe" ./variants/variant2/cmd/ostatki

          cat << 'BAT1' > "dist/Вариант 2/Запустить_Вариант_2.bat"
          @echo off
          chcp 65001 >nul
          start "" "%~dp0OstatkiZakupki_Вариант_2.exe"
          BAT1

          cat << 'BAT2' > "dist/Вариант 2/Автозаполнение_без_окна_Вариант_2.bat"
          @echo off
          chcp 65001 >nul
          "%~dp0OstatkiZakupki_Вариант_2_cli.exe" -headless -inplace -orders-output "Заявки поставщикам (авторасчёт).xlsx"
          echo.
          pause
          BAT2

          cp "Ведомость с периодом ОК (Вариант 2).xlsx" "dist/Вариант 2/"
          cp README.md AGENTS.md CHANGELOG.md "dist/Вариант 2/"

          cp "dist/Вариант 2/OstatkiZakupki_Вариант_2.exe" "dist/OstatkiZakupki_Variant_2.exe"
          (cd "dist/Вариант 2" && zip -r ../Variant_2_Windows_x64.zip .)

      - name: Публикация артефакта «Вариант 2»
        uses: actions/upload-artifact@v4
        with:
          name: Вариант 2
          path: dist/Вариант 2/*
          if-no-files-found: error

      - name: Публикация релиза GitHub «Вариант 2»
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_V2="Сохранённая сборка «Вариант 2» (первичная версия PRO SCM с аналитикой ABC×XYZ, фильтром выбросов и 5-листовым отчётом)."
          if gh release view variant-2 >/dev/null 2>&1; then
            for old in $(gh release view variant-2 --json assets --jq '.assets[].name'); do
              gh release delete-asset variant-2 "$old" -y || true
            done
            gh release edit variant-2 --latest=false --title "Вариант 2" --notes "$NOTES_V2"
            gh release upload variant-2 \
              "dist/OstatkiZakupki_Variant_2.exe#OstatkiZakupki_Variant_2.exe (Вариант 2 — Windows x64 GUI)" \
              "dist/Variant_2_Windows_x64.zip#Variant_2_Windows_x64.zip (Полный архив Вариант 2)" --clobber
          else
            gh release create variant-2 \
              --target "${{ github.sha }}" \
              --latest=false \
              --title "Вариант 2" \
              --notes "$NOTES_V2" \
              "dist/OstatkiZakupki_Variant_2.exe#OstatkiZakupki_Variant_2.exe (Вариант 2 — Windows x64 GUI)" \
              "dist/Variant_2_Windows_x64.zip#Variant_2_Windows_x64.zip (Полный архив Вариант 2)"
          fi

