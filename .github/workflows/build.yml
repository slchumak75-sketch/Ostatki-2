          cp "Ведомость с периодом ОК (1).xlsx" "dist/Вариант 4/"
          cp "Заявки поставщикам (авторасчёт).xlsx" "dist/Вариант 4/"
          cp README.md AGENTS.md CHANGELOG.md "dist/Вариант 4/"

          cp "dist/Вариант 4/OstatkiZakupki_Вариант_4.exe" "dist/OstatkiZakupki_Variant_4.exe"
          (cd "dist/Вариант 4" && zip -r ../Variant_4_Windows_x64.zip .)

          # Smoke-проверка пакетной обработки свежесобранным бинарником Варианта 4
          go build -trimpath -ldflags="-s -w" -o dist/ostatki-v4-linux ./cmd/ostatki
          ./dist/ostatki-v4-linux -headless -input "Ведомость с периодом ОК (1).xlsx" -output dist/verified_v4.xlsx

      - name: Публикация артефакта «Вариант 4»
        uses: actions/upload-artifact@v4
        with:
          name: Вариант 4
          path: dist/Вариант 4/*
          if-no-files-found: error

      - name: Публикация релиза GitHub «Вариант 4»
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_V4="Актуальная сборка «Вариант 4» (PRO SCM): вывод сразу всех строк номенклатуры без пагинации, закрепляемая вверху шапка таблицы при скроллинге, автоочистка старого значения в поле «Заказ» при ручном вводе новых данных, блок «Бюджет закупки» на одном уровне с «Режим планирования», однострочные Склад / Группа, индивидуальный Заказ .xlsx из 4 столбцов, светло-салатовая подсветка автозаказа и сегменты продаж 5..0."
          if gh release view variant-4 >/dev/null 2>&1; then
            for old in $(gh release view variant-4 --json assets --jq '.assets[].name'); do
              gh release delete-asset variant-4 "$old" -y || true
            done
            gh release edit variant-4 --latest --title "Вариант 4" --notes "$NOTES_V4"
            gh release upload variant-4 \
              "dist/OstatkiZakupki_Variant_4.exe#OstatkiZakupki_Variant_4.exe (Вариант 4 — Windows x64 GUI)" \
              "dist/Variant_4_Windows_x64.zip#Variant_4_Windows_x64.zip (Полный архив Вариант 4)" --clobber
          else
            gh release create variant-4 \
              --target "${{ github.sha }}" \
              --latest \
              --title "Вариант 4" \
              --notes "$NOTES_V4" \
              "dist/OstatkiZakupki_Variant_4.exe#OstatkiZakupki_Variant_4.exe (Вариант 4 — Windows x64 GUI)" \
              "dist/Variant_4_Windows_x64.zip#Variant_4_Windows_x64.zip (Полный архив Вариант 4)"
          fi
