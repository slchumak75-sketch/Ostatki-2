  build-variant-5:
    name: Вариант 5 (актуальная сборка PRO SCM)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Автотесты актуальной сборки «Вариант 5»
        run: |
          go vet ./cmd/... ./internal/...
          go test -v -race ./internal/...

      - name: Проверка фильтров заголовков таблицы
        run: |
          npm install --prefix /tmp/ui-check jsdom@26 --no-audit --no-fund
          NODE_PATH=/tmp/ui-check/node_modules node tests/excel-filters.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/relevant-items.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/nomenclature-properties.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/clear-database.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/property-row-order.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/virtual-scroll.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/desktop-lifecycle.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/etalon.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/reference-safety.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/etalon-comparison.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/sales-charts.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/liquidity.cjs
          NODE_PATH=/tmp/ui-check/node_modules node tests/radar-export.cjs

      - name: Кросс-компиляция Windows x64 — «Вариант 5»
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode

          mkdir -p "dist/Вариант 5" cert_tmp

          # Сборка без стриппинга таблиц символов (-s -w) и со встроенным Windows PE-ресурсом (.syso: иконка + манифест asInvoker + VERSIONINFO)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-H=windowsgui" \
            -o "dist/Вариант 5/OstatkiZakupki_Вариант_5_unsigned.exe" ./cmd/ostatki

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build \
            -o "dist/Вариант 5/OstatkiZakupki_Вариант_5_cli_unsigned.exe" ./cmd/ostatki

          # Выпуск Code Signing сертификата и расчёт PE Checksum + Authenticode SHA-256 подписи
          openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -sha256 \
            -subj "/CN=Ostatki 2 Desktop Application/O=Ostatki 2 SCM/C=BY" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign" \
            -addext "extendedKeyUsage=codeSigning" \
            -keyout cert_tmp/codesign.key \
            -out "dist/Вариант 5/Ostatki2_CodeSign.cer"

          osslsigncode sign \
            -certs "dist/Вариант 5/Ostatki2_CodeSign.cer" \
            -key cert_tmp/codesign.key \
            -h sha256 \
            -n "Остатки 2 (Вариант 5)" \
            -in "dist/Вариант 5/OstatkiZakupki_Вариант_5_unsigned.exe" \
            -out "dist/Вариант 5/OstatkiZakupki_Вариант_5.exe"

          osslsigncode sign \
            -certs "dist/Вариант 5/Ostatki2_CodeSign.cer" \
            -key cert_tmp/codesign.key \
            -h sha256 \
            -n "Остатки 2 CLI (Вариант 5)" \
            -in "dist/Вариант 5/OstatkiZakupki_Вариант_5_cli_unsigned.exe" \
            -out "dist/Вариант 5/OstatkiZakupki_Вариант_5_cli.exe"

          rm -rf cert_tmp "dist/Вариант 5/OstatkiZakupki_Вариант_5_unsigned.exe" "dist/Вариант 5/OstatkiZakupki_Вариант_5_cli_unsigned.exe"

          printf '%s\r\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command "Get-ChildItem -LiteralPath ''%~dp0'' -Include *.exe,*.cer -Recurse | Unblock-File -ErrorAction SilentlyContinue" >nul 2>&1' \
            'start "" "%~dp0OstatkiZakupki_Вариант_5.exe"' \
            > "dist/Вариант 5/Запустить_Вариант_5.bat"

          printf '%s\r\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'echo Установка сертификата доверенного издателя для «Остатки 2» (без прав администратора)...' \
            'powershell -NoProfile -ExecutionPolicy Bypass -Command "$c = Join-Path ''%~dp0'' ''Ostatki2_CodeSign.cer''; Unblock-File -LiteralPath $c -ErrorAction SilentlyContinue; Import-Certificate -FilePath $c -CertStoreLocation Cert:\CurrentUser\Root | Out-Null; Import-Certificate -FilePath $c -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null; Get-ChildItem -LiteralPath ''%~dp0'' -Filter *.exe | Unblock-File -ErrorAction SilentlyContinue"' \
            'echo Сертификат установлен. SmartScreen может по-прежнему показывать предупреждение.' \
            'pause' \
            > "dist/Вариант 5/Установить_сертификат_доверия_(один_раз).bat"

          printf '%s\r\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command "Get-ChildItem -LiteralPath ''%~dp0'' -Filter *.exe | Unblock-File -ErrorAction SilentlyContinue" >nul 2>&1' \
            '"%~dp0OstatkiZakupki_Вариант_5_cli.exe" -headless -inplace -orders-output "Заявки поставщикам (авторасчёт).xlsx"' \
            'echo.' \
            'pause' \
            > "dist/Вариант 5/Автозаполнение_без_окна_Вариант_5.bat"

          cat << 'TXT1' > "dist/Вариант 5/КАК_ЗАПУСТИТЬ_В_WINDOWS.txt"
          КАК ЗАПУСТИТЬ «ОСТАТКИ 2 — ВАРИАНТ 5» НА WINDOWS 10 / 11

          Способ 1 (рекомендуемый — из архива Variant_5_Windows_x64.zip):
          1. Распакуйте архив Variant_5_Windows_x64.zip в любую удобную папку.
          2. Запустите файл «Запустить_Вариант_5.bat» — он автоматически снимает метку скачивания
             из интернета и открывает программу в развёрнутом окне без всплывающей панели браузера.
          3. SmartScreen «Система Windows защитила ваш компьютер» может появиться при первом запуске.
             Самоподписанный сертификат не устраняет это предупреждение. Установка его в доверенные
             корневые сертификаты меняет доверие Windows: выполняйте её только по решению администратора.
             Не отключайте SmartScreen или антивирус. Для распространения без лишних предупреждений
             требуется доверенная подпись издателя и репутация приложения; даже такая подпись
             не гарантирует отсутствие предупреждения для новой версии.

          Способ 2 (при прямом скачивании одиночного OstatkiZakupki_Variant_5.exe):
          - При первом открытии в окне SmartScreen нажмите «Подробнее» -> «Выполнить в любом случае»
            (или правый клик по файлу -> «Свойства» -> галочка «Разблокировать» -> ОК).
          TXT1

          cp "Ведомость с периодом ОК (1).xlsx" "dist/Вариант 5/"
          cp "Ведомость с периодом ОК.xlsx" "dist/Вариант 5/"
          cp "Заявки поставщикам (авторасчёт).xlsx" "dist/Вариант 5/"
          cp README.md AGENTS.md CHANGELOG.md "dist/Вариант 5/"

          cp "dist/Вариант 5/OstatkiZakupki_Вариант_5.exe" "dist/OstatkiZakupki_Variant_5.exe"
          (cd "dist/Вариант 5" && zip -r ../Variant_5_Windows_x64.zip .)

          # Smoke-проверка пакетной обработки свежесобранным бинарником Варианта 5
          go build -trimpath -ldflags="-s -w" -o dist/ostatki-v5-linux ./cmd/ostatki
          ./dist/ostatki-v5-linux -headless -input "Ведомость с периодом ОК (1).xlsx" -output dist/verified_v5.xlsx

      - name: Публикация артефакта «Вариант 5»
        uses: actions/upload-artifact@v4
        with:
          name: Вариант 5
          path: dist/Вариант 5/*
          if-no-files-found: error

      - name: Публикация релиза GitHub «Вариант 5»
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_V5="Вариант 5: ручное сохранение и загрузка эталона номенклатуры (Эталон и дата). Единые поля: Склад, Артикул, Номенклатура, +, Рейтинг, Остаток. Рейтинг эталона фиксирован; остатки обновляются только из ведомости 1С. Эталон не перезаписывается при автосохранении и выходе. Импорт старых свойств и JSON-копий сохранён. Подпись Authenticode SHA-256."
          gh release delete variant-5 --cleanup-tag -y || true
          gh release create variant-5 \
            --target "${{ github.sha }}" \
            --latest \
            --title "Вариант 5" \
            --notes "$NOTES_V5" \
            "dist/OstatkiZakupki_Variant_5.exe#OstatkiZakupki_Variant_5.exe (Вариант 5 — Windows x64 GUI)" \
            "dist/Variant_5_Windows_x64.zip#Variant_5_Windows_x64.zip (Полный архив Вариант 5)"
