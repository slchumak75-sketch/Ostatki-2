name: Build Windows App (Go + HTML GUI)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-windows:
    name: Тесты и сборка Windows (.exe)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Статический анализ и автотесты (включая реальный Excel-файл)
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Кросс-компиляция Windows GUI и CLI приложений (x64)
        run: |
          mkdir -p dist/Ostatki-2-Windows-x64

          # 1. Десктопное Windows-приложение с HTML GUI (без консольного окна cmd.exe)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o dist/Ostatki-2-Windows-x64/OstatkiZakupki.exe ./cmd/ostatki

          # 2. Консольная утилита для пакетного запуска из .bat / 1С / Планировщика Windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/Ostatki-2-Windows-x64/OstatkiZakupki-cli.exe ./cmd/ostatki

          # 3. Удобные сценарии быстрого запуска для Windows
          cat << 'BAT1' > dist/Ostatki-2-Windows-x64/Запустить_GUI.bat
          @echo off
          chcp 65001 >nul
          start "" "%~dp0OstatkiZakupki.exe"
          BAT1

          cat << 'BAT2' > dist/Ostatki-2-Windows-x64/Автозаполнение_без_окна.bat
          @echo off
          chcp 65001 >nul
          "%~dp0OstatkiZakupki-cli.exe" -headless -inplace -orders-output "Заявки поставщикам (авторасчёт).xlsx"
          echo.
          pause
          BAT2

          cp "Ведомость с периодом ОК (1).xlsx" dist/Ostatki-2-Windows-x64/
          cp README.md AGENTS.md CHANGELOG.md dist/Ostatki-2-Windows-x64/

          cd dist
          zip -r Ostatki-2-Windows-x64.zip Ostatki-2-Windows-x64
          ls -lh Ostatki-2-Windows-x64/ Ostatki-2-Windows-x64.zip

      - name: Проверка пакетной обработки свежесобранным бинарником (Linux check)
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/ostatki-linux ./cmd/ostatki
          ./dist/ostatki-linux -headless -input "Ведомость с периодом ОК (1).xlsx" -output dist/verified_output.xlsx

      - name: Публикация готового Windows .exe (быстрое скачивание)
        uses: actions/upload-artifact@v4
        with:
          name: OstatkiZakupki-Windows-x64-exe
          path: dist/Ostatki-2-Windows-x64/OstatkiZakupki.exe
          if-no-files-found: error

      - name: Публикация полного дистрибутива Windows (GUI + CLI + Ведомость + Инструкция)
        uses: actions/upload-artifact@v4
        with:
          name: Ostatki-2-Windows-x64-Bundle
          path: dist/Ostatki-2-Windows-x64/*
          if-no-files-found: error

      - name: Автоматический GitHub Release при создании тега v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ostatki-2-Windows-x64/OstatkiZakupki.exe
            dist/Ostatki-2-Windows-x64/OstatkiZakupki-cli.exe
            dist/Ostatki-2-Windows-x64.zip
          generate_release_notes: true
